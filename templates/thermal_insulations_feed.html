<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Теплоизоляция</title>
    <link rel="stylesheet" href="/static/css/thermal_insulations_style.css">
</head>
<body>
    <div class="frame">
        <video autoplay loop muted playsinline style="width: 440px; height: 978px; left: 0; top: -22px; position: absolute"><source src="{{insulator.video_url}}" type="video/mp4"></video>
        <div class="background"></div>
        <div class="bottom_line"></div>

        <a class="buttons active" style="left: 32px; top: 859px;" href="/"></a>
        <img class="size_30" style="left: 57px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/6398/6398532.png"  alt="Лента">
        <div class="button_text text_feed">Лента</div>
        <a class="buttons" style="left: 180px; top: 859px;" href="/add_thermal_insulations"></a>
        <img class="size_30" style="left: 206px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/12194/12194587.png"  alt="Новое">
        <div class="button_text text_add">Добавить</div>
        <a class="buttons" style="left: 328px; top: 859px;" href="/list_thermal_insulations"></a>
        <img class="size_30" style="left: 353px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/5880/5880909.png"  alt="Плитка">
        <div class="button_text text_list">Плитка</div>

        <img class="size_50" style="left: 359px; top: 610px" src="https://cdn-icons-png.flaticon.com/512/1077/1077086.png"  alt="Лайк">
        <div class="side_text likes">{{liked}}</div>
        <img class="size_50" style="left: 359px; top: 525px" src="https://cdn-icons-png.flaticon.com/512/3815/3815398.png"  alt="Коэффициент">
        <div class="side_text coefficient">{{insulator.coefficient}} мВт/(м·°C)</div>
        <img class="size_50" style="left: 359px; top: 440px" src="https://cdn-icons-png.flaticon.com/512/1611/1611179.png"  alt="Цена">
        <div class="side_text price">{{insulator.price}} руб.</div>
        <a href="/?id={{nextid}}"><img class="size_50" style="left: 359px; top: 695px" src="https://cdn-icons-png.flaticon.com/512/7539/7539941.png"  alt="Дальше"></a>
        <div class="side_text next">Дальше</div>

        <div class="description">{{insulator.description}}</div>
        <!-- <div class="side_text more">Больше</div> -->
    </div>
</body>
</html>
