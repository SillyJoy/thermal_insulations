<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Теплоизоляция</title>
    <link rel="stylesheet" href="/static/css/thermal_insulations_style.css">
</head>
<body>
    <div class="dark_bg"></div>
    <div class="bottom_line"></div>

    <a class="buttons active" style="left: 32px; top: 859px;" href="/"></a>
    <img class="size_30" style="left: 57px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/6398/6398532.png"  alt="Лента">
    <div class="button_text text_feed">Лента</div>
    <a class="buttons" style="left: 180px; top: 859px;" href="/add_thermal_insulations"></a>
    <img class="size_30" style="left: 206px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/12194/12194587.png"  alt="Новое">
    <div class="button_text text_add">Добавить</div>
    <a class="buttons" style="left: 328px; top: 859px;" href="/list_thermal_insulations"></a>
    <img class="size_30" style="left: 353px; top: 869px" src="https://cdn-icons-png.flaticon.com/512/5880/5880909.png"  alt="Плитка">
    <div class="button_text text_list">Плитка</div>

    <div class="big_button" style="top: 47px"></div>
    <div class="big_button" style="top: 155px"></div>
    <img style="width: 94px; height: 94px; left: 43px; top: 45px; position: absolute" src="https://cdn-icons-png.flaticon.com/512/9053/9053986.png" alt="">
    <img style="width: 80px; height: 80px; left: 50px; top: 160px; position: absolute" src="https://cdn-icons-png.flaticon.com/512/8572/8572505.png" alt="">

    {% if publish %}
    <form action="/insulation/add/" method="POST">
    {% else %}
    <form action="/insulation/{{ draft.id }}/publish" method="POST">
    {% endif %}
    <div class="big_button_text" style="top: 187px">Загрузить видео</div>
    <div class="big_button_text" style="top: 80px">Загрузить фото</div>

    <div class="label" style="left: 30px; top: 271px">Описание</div>
    <input name="descr" class="input_field" style="width: 405px; height: 147px; left: 18px; top: 306px" type="text" placeholder="Укажите описание..." value="{{ draft.description }}">

    <div class="label" style="left: 30px; top: 475px">Коэффициент теплопроводности</div>
    <input name="coef" class="input_field" style="width: 405px; height: 48px; left: 18px; top: 510px" type="text" placeholder="Укажите коэффициент теплопроводности..." value="{{ draft.coefficient }}">

    <div class="label" style="left: 30px; top: 580px">Стоимость</div>
    <input name="price" class="input_field" style="width: 405px; height: 48px; left: 18px; top: 615px" type="text" placeholder="Укажите стоимость..." value="{{ draft.price }}">

    <div class="label" style="left: 30px; top: 680px">Название</div>
    <input name="title" class="input_field" style="width: 405px; height: 48px; left: 18px; top: 715px" type="text" placeholder="Укажите название..." value="{{ draft.title }}">

    <button type="submit" class="create_button"></button>
    {% if publish %}
    <div class="create_button_text">Добавить</div>
    {% else %}
    <div class="create_button_text">Опубликовать</div>
    {% endif %}
    </form>
</body>
</html>
